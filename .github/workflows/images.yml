name: Build flashable images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32c3
          - rp2040
          - rp2040smp
          - rp2350
          - rp2350smp
          - rp2350rv
          - rp2350rvsmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # The build drives clang for every target and ld.lld directly for
      # linking; mklfs is a normal host C program compiled by the same clang.
      #
      # The version matters more than it looks: user/msh/msh.c sits 60 bytes
      # under its 8 KiB budget at -Oz with clang 23, and the distro's clang 18
      # produces a 12 KiB image, which turns msh's window from 16 KiB into
      # 32 KiB and trips TOS_ONE_GRAIN().  So install the newest LLVM the
      # Ubuntu release has a package for, and fall back to the distro one only
      # if apt.llvm.org is unreachable (then the size check will tell us).
      - name: Install LLVM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libc6-dev wget gpg
          . /etc/os-release
          codename="${UBUNTU_CODENAME:-noble}"
          got=""
          if wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
               | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg; then
            for v in 23 22 21 20 19; do
              if curl -fsSL "https://apt.llvm.org/${codename}/dists/llvm-toolchain-${codename}-${v}/Release" >/dev/null 2>&1; then
                echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${v} main" \
                  | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
                sudo apt-get update
                if sudo apt-get install -y "clang-${v}" "lld-${v}"; then
                  sudo ln -sf "/usr/bin/clang-${v}" /usr/local/bin/clang
                  sudo ln -sf "/usr/bin/ld.lld-${v}" /usr/local/bin/ld.lld
                  got="clang-${v}"
                  break
                fi
              fi
            done
          fi
          if [ -z "$got" ]; then
            echo "::warning::apt.llvm.org unavailable, using the distro clang (sizes may differ)"
            sudo apt-get install -y clang lld
          else
            echo "using $got"
          fi

      - name: Show toolchain
        run: |
          clang --version
          ld.lld --version
          go version

      - name: Build ${{ matrix.target }}
        run: go run ./cmd/tos build -target ${{ matrix.target }}

      - name: Report image sizes
        run: |
          wc -c build/user/bin/msh build/user/bin/sh 2>/dev/null || true

      - name: Collect images
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          out="dist/$target"
          mkdir -p "$out"

          if [ "$target" = "esp32c3" ]; then
            cp build/esp32c3.bin "$out/"
            cp build/ramdisk-esp32c3.bin "$out/"
            cp build/esp32c3-full.bin "$out/"
            {
              echo "TinyOS ESP32-C3 flash images"
              echo
              echo "One file, one write - kernel and littlefs together:"
              echo
              echo "  esptool --chip esp32c3 write-flash 0x0 esp32c3-full.bin"
              echo
              echo "Or the split pair, which leaves 0x20000..0x80000 untouched"
              echo "and lets you update the kernel without rewriting the"
              echo "filesystem:"
              echo
              echo "  esptool.py --chip esp32c3 write-flash 0x0     esp32c3.bin"
              echo "  esptool.py --chip esp32c3 write-flash 0x80000 ramdisk-esp32c3.bin"
              echo
              echo "Both contain the same bytes at every address the split pair"
              echo "writes; esp32c3-full.bin just pads to the filesystem offset."
              echo
              echo "Put the board in download mode first (hold BOOT, tap RESET)."
            } > "$out/FLASH-$target.txt"
          else
            cp "build/$target.uf2" "$out/"
            {
              echo "TinyOS $target UF2 image"
              echo
              echo "Hold BOOTSEL while connecting USB, then copy the .uf2"
              echo "file to the RPI-RP2 (or RP2350) mass-storage drive."
              echo "The board reboots into TinyOS when the copy completes."
            } > "$out/FLASH-$target.txt"
          fi

          # What this image was built from: a menuconfig build and the release
          # defaults differ in heap/opt/programs, and that must be visible in
          # the artifact rather than inferred from the tag.
          cp build/build-config.txt "$out/" 2>/dev/null || true

          for f in "$out"/*; do
            test -s "$f" || { echo "empty file: $f"; exit 1; }
          done
          ls -l "$out"

      - name: Upload ${{ matrix.target }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyos-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: qemu smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libc6-dev \
            qemu-system-misc qemu-system-x86 qemu-system-arm
      # x86 is deliberately absent: it has never been built on the distro
      # toolchain and does not link there (i386 PIE rejects the 16-bit
      # relocations the port produces, "R_386_16 cannot be used against local
      # symbol").  That is logged as OPEN-ITEMS 37; the three RISC-V/ARM
      # targets below are the ones this job is here to protect.
      - name: Build the QEMU targets
        run: |
          set -euo pipefail
          for t in rv32 rv32smp arm; do
            go run ./cmd/tos build -target "$t"
          done
      - name: Boot and drive each one
        run: |
          set -euo pipefail
          for t in rv32 rv32smp arm; do
            go run ./cmd/tostest smoke -target "$t" \
              -commands "ps, ls /bin | wc, piperace, prot stack, deep 3" \
              -commandwait-ms 4000
          done
      - name: Window and segment soak
        run: python3 scripts/soak.py --cycles 3

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tinyos-*

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          mapfile -t files < <(find dist -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no artifacts downloaded"; exit 1
          fi
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$repo" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --repo "$repo" \
              --title "TinyOS $tag" \
              --notes "TinyOS $tag flashable images for ESP32-C3, RP2040 and RP2350 (ARM/RISC-V, single and dual core)."
          fi
