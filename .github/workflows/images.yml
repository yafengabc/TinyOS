name: Build flashable images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: go test and vet
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      # The syscall-snapshot test compares goc32/abi/syscalls.snapshot.csv with
      # abi/syscalls.csv; without the submodule the test skips, and a skipped
      # gate is not a gate.  .gitmodules names an ssh URL, which a runner
      # cannot use, so rewrite it to https for this one fetch.
      - name: Fetch the goc32 submodule
        run: |
          git -c url."https://github.com/".insteadOf="git@github.com:" \
            submodule update --init goc32
      # The snapshot test skips when the file is absent, which is right on a
      # machine without the submodule but would silently disable the gate in
      # CI.  Fail here instead, in one line.
      - name: Confirm the syscall snapshot is present
        run: test -s goc32/abi/syscalls.snapshot.csv
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...

  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32c3-generic
          - rpi-pico
          - rpi-pico-smp
          - atk-dnr2350am
          - atk-dnr2350am-smp
          - atk-dnr2350am-rv32
          - atk-dnr2350am-rv32-smp
          - rpi-pico2
          - rpi-pico2-smp
          - rpi-pico2-rv32
          - rpi-pico2-rv32-smp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # The build drives clang for every target and ld.lld directly for
      # linking; mklfs is a normal host C program compiled by the same clang.
      #
      # The version matters more than it looks: user/msh/msh.c sits 60 bytes
      # under its 8 KiB budget at -Oz with clang 23, and the distro's clang 18
      # produces a 12 KiB image, which turns msh's window from 16 KiB into
      # 32 KiB and trips TOS_ONE_GRAIN().  So install the newest LLVM the
      # Ubuntu release has a package for, and fall back to the distro one only
      # if apt.llvm.org is unreachable (then the size check will tell us).
      - name: Install LLVM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libc6-dev wget gpg
          . /etc/os-release
          codename="${UBUNTU_CODENAME:-noble}"
          got=""
          if wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
               | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg; then
            for v in 23 22 21 20 19; do
              if curl -fsSL "https://apt.llvm.org/${codename}/dists/llvm-toolchain-${codename}-${v}/Release" >/dev/null 2>&1; then
                echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${v} main" \
                  | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
                sudo apt-get update
                if sudo apt-get install -y "clang-${v}" "lld-${v}"; then
                  sudo ln -sf "/usr/bin/clang-${v}" /usr/local/bin/clang
                  sudo ln -sf "/usr/bin/ld.lld-${v}" /usr/local/bin/ld.lld
                  got="clang-${v}"
                  break
                fi
              fi
            done
          fi
          if [ -z "$got" ]; then
            echo "::warning::apt.llvm.org unavailable, using the distro clang (sizes may differ)"
            sudo apt-get install -y clang lld
          else
            echo "using $got"
          fi

      - name: Show toolchain
        run: |
          clang --version
          ld.lld --version
          go version

      - name: Build ${{ matrix.target }}
        # Release artifacts are built quiet: configs/release.conf turns
        # boot_trace off, so the [A]..[E] bring-up markers, the P1/P2 USB
        # progress lines and the [cpu1]/[mpu] diagnostics are compiled out.
        # The smoke job below deliberately keeps the default (traces on) and
        # so does any acceptance run, because accept33.py reads those markers.
        run: go run ./cmd/tos build -target ${{ matrix.target }} -config configs/release.conf

      - name: Report image sizes
        run: |
          wc -c build/user/bin/msh build/user/bin/sh 2>/dev/null || true

      - name: Collect images
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          out="dist/$target"
          mkdir -p "$out"

          if [ "$target" = "esp32c3-generic" ]; then
            cp build/tinyos-esp32c3-generic.bin "$out/"
            cp build/tinyos-ramdisk-esp32c3-generic.bin "$out/"
            cp build/tinyos-esp32c3-generic-full.bin "$out/"
            {
              echo "TinyOS ESP32-C3 flash images"
              echo
              echo "One file, one write - kernel and littlefs together:"
              echo
              echo "  esptool --chip esp32c3 write-flash 0x0 tinyos-esp32c3-generic-full.bin"
              echo
              echo "Or the split pair, which leaves 0x20000..0x80000 untouched"
              echo "and lets you update the kernel without rewriting the"
              echo "filesystem:"
              echo
              echo "  esptool.py --chip esp32c3 write-flash 0x0     tinyos-esp32c3-generic.bin"
              echo "  esptool.py --chip esp32c3 write-flash 0x80000 tinyos-ramdisk-esp32c3-generic.bin"
              echo
              echo "Both contain the same bytes at every address the split pair"
              echo "writes; tinyos-esp32c3-generic-full.bin just pads to the filesystem offset."
              echo
              echo "Put the board in download mode first (hold BOOT, tap RESET)."
            } > "$out/tinyos-$target.flash.txt"
          else
            cp "build/tinyos-$target.uf2" "$out/"
            {
              echo "TinyOS $target UF2 image"
              echo
              echo "Hold BOOTSEL while connecting USB, then copy the .uf2"
              echo "file to the RPI-RP2 (or RP2350) mass-storage drive."
              echo "The board reboots into TinyOS when the copy completes."
            } > "$out/tinyos-$target.flash.txt"
          fi

          # What this image was built from: a menuconfig build and the release
          # defaults differ in heap/opt/programs, and that must be visible in
          # the artifact rather than inferred from the tag.  Same prefix as the
          # image so every file belonging to a target sorts together.
          cp build/build-config.txt "$out/tinyos-$target.build-config.txt" 2>/dev/null || true

          for f in "$out"/*; do
            test -s "$f" || { echo "empty file: $f"; exit 1; }
          done
          ls -l "$out"

      - name: Upload ${{ matrix.target }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyos-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

  tools:
    name: host tools (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            ext: .exe
            archive: zip
          - name: linux-amd64
            os: ubuntu-24.04
            ext: ""
            archive: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Go tools are self-contained binaries, so users do not need Go.
      # goc32 and rv32emu-c are submodules; .gitmodules names ssh URLs that
      # a runner cannot use, so rewrite them for this fetch.
      - name: Fetch the tool submodules
        shell: bash
        run: |
          git -c url."https://github.com/".insteadOf="git@github.com:" \
            submodule update --init --recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install MSYS2 gcc (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build host tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/tools
          go build -trimpath -ldflags "-s -w" -o "dist/tools/tos${{ matrix.ext }}" ./cmd/tos
          go build -trimpath -ldflags "-s -w" -o "dist/tools/tostest${{ matrix.ext }}" ./cmd/tostest
          (cd goc32 && go build -trimpath -ldflags "-s -w" -o "../dist/tools/goc32${{ matrix.ext }}" .)
          (cd tools/tosput && go build -trimpath -ldflags "-s -w" -o "../../dist/tools/tosput-cli${{ matrix.ext }}" .)
          (cd rv32emu-c && go run ./cmd/rv32emu-build emu)
          cp "rv32emu-c/build/rv32emu-c${{ matrix.ext }}" dist/tools/
          cat > dist/tools/README.txt <<'EOF'
          TinyOS host tools
          =================

          rv32emu-c
            Try TinyOS without a board:
              rv32emu-c -flashimg tinyos-esp32c3-generic-full.bin
            Download that image from the TinyOS release page.

          goc32
            Build a user program (no clang needed):
              goc32 -target esp32c3 -o hello.tos user/hello.c

          tosput-cli
            Send a .tos to a running board over its console:
              tosput-cli COM4 hello.tos /bin/hello

          tos, tostest
            Build images and run QEMU smoke tests.  These still need
            clang + ld.lld on PATH; they are not needed just to try
            TinyOS or to build a single user program.
          EOF

      - name: Pack the tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/tools/* -DestinationPath "dist/tinyos-tools-${{ matrix.name }}.zip"

      - name: Pack the tools (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -C dist/tools -czf "dist/tinyos-tools-${{ matrix.name }}.tar.gz" .

      - name: Upload the tools
        uses: actions/upload-artifact@v4
        with:
          name: tinyos-tools-${{ matrix.name }}
          path: dist/tinyos-tools-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: qemu smoke (${{ matrix.target }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One job per target so a failure names the target and the legs run
        # side by side: the old serial job spent five minutes on this.  The
        # distro toolchain is deliberate - it is the one that exposes
        # toolchain-dependent breakage (x86's clang-to-gcc link, the 90 KiB
        # kernel budget), while the release matrix uses apt.llvm.org.
        include:
          - target: rv32
          - target: rv32smp
          - target: arm
          - target: x86
          - target: read-only
            config: configs/rv32-fsro.conf
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libc6-dev \
            qemu-system-misc qemu-system-x86 qemu-system-arm
      - name: Build
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "read-only" ]; then
            go run ./cmd/tos build -config "${{ matrix.config }}"
          else
            go run ./cmd/tos build -target "${{ matrix.target }}"
          fi
      - name: Boot and drive it
        if: matrix.target != 'read-only'
        run: |
          go run ./cmd/tostest smoke -target "${{ matrix.target }}" \
            -commands "ps, ls /bin | wc, cat /proc/execfmt, piperace, prot stack, deep 3, rselftest" \
            -commandwait-ms 4000

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, build, smoke, tools]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tinyos-*

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          mapfile -t files < <(find dist -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no artifacts downloaded"; exit 1
          fi
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$repo" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --repo "$repo" \
              --title "TinyOS $tag" \
              --notes "TinyOS $tag flashable images for ESP32-C3, RP2040 and RP2350 (ARM/RISC-V, single and dual core), plus standalone host tools for Windows and Linux."
          fi
