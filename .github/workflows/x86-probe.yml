# Manual probe for OPEN-ITEMS 5: does `-target x86` build on a stock Ubuntu
# toolchain?  The answer used to be no (i386 PIE rejected the port's 16-bit
# relocations), but the user-program link switched to -fPIC since then and
# nobody has re-measured on the distro clang.  This job is not part of the push
# pipeline: it exists so the question can be answered with a log instead of a
# guess.  Delete it once x86 is either in the release matrix or documented as
# still broken with a current log.
name: x86 probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: x86 on the distro toolchain
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install the distro toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libc6-dev

      - name: Show toolchain
        run: |
          clang --version
          ld.lld --version
          go version
          go run ./cmd/tos doctor

      - name: Build x86
        run: go run ./cmd/tos build -target x86 -v

      - name: Report what came out
        if: success()
        run: |
          ls -l build/tinyos.img build/kernel-x86.elf 2>/dev/null || true
          grep -E '^(target|arch|board)' build/build-config.txt || true
