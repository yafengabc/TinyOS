# Target: one image.  Board facts live in board/atk-dnr2350am-rv32/board.conf;
# this file only names the board and the image knobs (C1: three layers).
[target]
name = atk-dnr2350am-rv32
board = atk-dnr2350am-rv32
arch = rv32
rcc_arch = rv32
# rv32ima, not rv32imac: this port's PMP map covers one code run with
# several page-granular NAPOT blocks (PMP_GRAIN = 3, 32-byte minimum),
# and RISC-V requires a single entry to cover a whole access, so a
# 32-bit instruction at page_end-2 would straddle two blocks and fault.
# Four-byte instructions cannot cross a page.  Applies to the kernel
# too, which does not need it but costs only flash.  See
# board/rp2350rv-generic/pmp_map.h and docs/OPEN-ITEMS.md.
march = rv32ima
heap = 32k
