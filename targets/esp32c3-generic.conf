# Target: one image.  Board facts live in board/esp32c3-generic/board.conf;
# this file only names the board and the image knobs (C1: three layers).
[target]
name = esp32c3-generic
board = esp32c3-generic
arch = rv32
rcc_arch = rv32
march = rv32imc
heap = 80k
max_procs = 8

# Whole-kernel -Oz, measured on the board rather than assumed: 5 reps of
# dd (400K write / read+verify / 800K write) and csc (cover, state) came out
# within run-to-run noise of -O2, boot to prompt 0.40 vs 0.41 s, while the
# app image drops 100.7 -> 81.6 KiB.  The code budget here is the first
# 512 KiB (board.conf lfs_offset), so the headroom is worth having.  The C3
# board layer has no inlined diag printers, which is why -Oz costs it so
# little.  See issue #56.
opt = -Oz
