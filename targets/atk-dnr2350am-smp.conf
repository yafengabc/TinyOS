# Target: one image.  Board facts live in board/atk-dnr2350am/board.conf;
# this file only names the board and the image knobs (C1: three layers).
[target]
name = atk-dnr2350am-smp
# -Os: measured on ATK M33 SMP with the user programs pinned at -O2 -
# 30% smaller than -O2, CoreMark 487 vs 478, smpbench 2.00-2.05x.
# -Oz is smaller still (88 KiB) but drops SMP scaling to 1.85-1.90x.
opt = -Os
# Keep programs at -O2: the kernel -Os is what this image wants, the
# benchmarks/interpreters are not.  msh/py keep their own -Oz opt file.
user_opt = -O2
board = atk-dnr2350am
arch = arm
rcc_arch = thumb2
cpus = 2
heap = 60k
