# ATK-DNRP2350AM (RP2350, Cortex-M33): the dev board this port was written on.
#
# Everything the silicon does comes from board/rp2350-generic; this file is
# only what the board adds: the panel and card slot on the shared GPIO10/11
# pair, a 4 MiB W25Q32 behind littlefs, and the ATK's own LED/key row in
# board_data.c.
[board]
schema = 1
chip = rp2350
variant = atk-dnr2350am
base = rp2350-generic
peripherals = gpio, uart, usb, spi, i2c, pwm, dma, pio, lcd, flash
fs_backing = flash
ramdisk_sectors = 1024
flash_bytes = 4m
lfs_offset = 512k
drivers = drivers/gpio/rp2350, drivers/spi/rp2350, drivers/display/st7789, drivers/usb/rp2350, drivers/pio/rp2
features = pio, rir

# No WiFi radio on this board; the generic baseline already drops the display
# programs, which this board brings back by compiling the panel driver, so the
# exclude list here is only the radio.
[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http

[window]
grain = 4k
stack = 4k
guard = 4k
