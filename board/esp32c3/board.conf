# ESP32-C3 DevKit: Wi-Fi is part of the SoC; no LCD/PSRAM on the reference board.
[board]
schema = 1
chip = esp32c3
variant = devkit
peripherals = gpio, uart, usb, wifi, spi, i2c, pwm, flash
fs_backing = flash
ramdisk_sectors = 600
flash_bytes = 4m
lfs_offset = 512k
xip_flash_base = 0x10000
drivers = drivers/gpio/esp32c3, drivers/serial/esp32c3
features = pwm, spi, i2c

[window]
grain = 4k
stack = 4k
guard = 4k
