# RP2350 chip baseline for the Hazard3 RISC-V image.
#
# Inherits everything that is not ISA-specific from the ARM baseline:
# layout.c (same SRAM map), board_internal.h, and the LED/key code in
# board_devs.c that reads the board's device table.  It supplies the RISC-V
# port's platform.c, linker script and PICOBIN header, because those carry the
# ISA.
#
# Same contract as board/rp2350-generic: UART0/USB console plus the generic
# bus drivers, RAM disk, no pin claims.
[board]
schema = 1
chip = rp2350
variant = generic-rp2350rv
base = rp2350-generic
peripherals = gpio, uart, usb, spi, i2c, pwm, dma, pio
fs_backing = embedded
ramdisk_sectors = 600
drivers = drivers/gpio/rp2350rv, drivers/spi/rp2350rv, drivers/usb/rp2350rv, drivers/pio/rp2
# Same two defaults as the ARM baseline: user threads, and the USB state
# machine in a pinned kernel thread instead of the idle/PendSV hooks.
features = pio, kthreads, usb_pump

[user]
# One code run, several PMP entries (page-granular NAPOT, 32-byte minimum
# region), so a 32-bit instruction at page_end-2 would fault.  Try the
# compressed form and let the build rebuild only the programs whose linked
# image would straddle a page; see internal/build/codepage.go.
rvc = auto
# The demos/probes do not fit next to the common tools in the embedded
# 300 KiB filesystem; board images keep them.
exclude = wifiscan,wificonn,ping,net,dhcp,host,http,screen,lcdconsole,splash,fb,hello,hello_printf,coremark,smp,smpbench,piperace,floattest,rawsink,samp,spin,swcost,rselftest,reloc,cpuprobe,crash,hold,prot,stk,bench,deep,wheap,mem

[window]
# 16 KiB: PMP puts the stack in its own NAPOT region, so a stack hint must
# divide the grain and the on-board tools ask for 16 KiB (see layout.c).
grain = 16k
stack = 4k
guard = 4k
stack_align = 1
