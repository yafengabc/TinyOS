# RP2350 chip baseline for the Hazard3 RISC-V image.
#
# Inherits everything that is not ISA-specific from the ARM baseline:
# layout.c (same SRAM map), board_internal.h, and the LED/key code in
# board_devs.c that reads the board's device table.  It supplies the RISC-V
# port's platform.c, linker script and PICOBIN header, because those carry the
# ISA.
#
# Same contract as board/rp2350-generic: UART0/USB console plus the generic
# bus drivers, RAM disk, no pin claims.
[board]
schema = 1
chip = rp2350
variant = generic-rp2350rv
base = rp2350-generic
peripherals = gpio, uart, usb, spi, i2c, pwm, dma, pio
fs_backing = embedded
ramdisk_sectors = 600
drivers = drivers/gpio/rp2350rv, drivers/spi/rp2350rv, drivers/usb/rp2350rv, drivers/pio/rp2
features = pio

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http,screen,lcdconsole,splash,fb

[window]
grain = 4k
stack = 4k
guard = 4k
