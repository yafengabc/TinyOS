# ATK-DNRP2350AM with the Hazard3 RISC-V cores: same board, different chip image.
[board]
schema = 1
chip = rp2350
variant = atk-dnr2350am-rv32
peripherals = gpio, uart, usb, spi, i2c, pwm, dma, pio, lcd, flash
fs_backing = flash
ramdisk_sectors = 704
drivers = drivers/gpio/rp2350rv, drivers/spi/rp2350rv, drivers/display/st7789, drivers/usb/rp2350rv, drivers/pio/rp2
features = pio

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http

[window]
grain = 4k
stack = 4k
guard = 4k
