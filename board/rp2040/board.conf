# Raspberry Pi Pico (RP2040): Cortex-M0+, no MPU/PMP, GP25 LED, 2 MiB flash.
[board]
schema = 1
chip = rp2040
variant = pico
peripherals = gpio, uart, usb, spi, i2c, pwm, dma, pio, flash
fs_backing = flash
ramdisk_sectors = 1200
drivers = drivers/gpio/rp2040, drivers/usb/rp2040, drivers/pio/rp2
features = pwm, uart1, spi, i2c, dma, pio

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http,prot

[window]
grain = 4k
stack = 4k
guard = 4k
