# RP2350 chip baseline (Cortex-M33): the smallest image that boots on any
# board built around this silicon.  No pins are claimed beyond the chip's own
# UART0/USB, and no storage assumption is made - the filesystem is a RAM disk,
# so the image does not care whether the board has 1, 2, 4 or 8 MiB of flash
# or none at all.
#
# Concrete boards add their wiring on top (base = rp2350-generic):
#   board/atk-dnr2350am   the ATK dev board: panel, card slot, LED, 4 MiB
#   board/pico2           Raspberry Pi Pico 2: LED on GP25, no panel
#
# What a generic image gives you: console on UART0 (GP0/GP1) or USB CDC, the
# GPIO/SPI/I2C drivers, and a shell.  What it cannot know: which pins the
# board actually exposes.  That is the contract - if it boots here, the
# silicon and the port are fine.
[board]
schema = 1
chip = rp2350
variant = generic-rp2350
peripherals = gpio, uart, usb, spi, i2c, pwm, dma, pio
fs_backing = embedded
ramdisk_sectors = 600
drivers = drivers/gpio/rp2350, drivers/spi/rp2350, drivers/usb/rp2350, drivers/pio/rp2
features = pio

# Programs that need hardware the baseline does not claim: no radio, no panel.
[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http,screen,lcdconsole,splash,fb

[window]
grain = 4k
stack = 4k
guard = 4k
