# ATK-DNRP2350AM (RP2350, Cortex-M33): the default board target for this port.
[board]
schema = 1
chip = rp2350
variant = atk-dnr2350am
peripherals = gpio, uart, usb, spi, i2c, pwm, dma, pio, lcd, flash
fs_backing = flash
ramdisk_sectors = 704
drivers = drivers/gpio/rp2350, drivers/spi/rp2350, drivers/display/st7789/rp2350, drivers/usb/rp2350, drivers/pio/rp2
features = pio

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http

[window]
grain = 4k
stack = 4k
guard = 4k
