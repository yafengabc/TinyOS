# ESP32-C3 chip baseline: Wi-Fi is part of the SoC, and the reference devkit's
# 4 MiB flash is the only board fact.  A module with a different flash part
# changes flash_bytes/lfs_offset here, not in any C file.
[board]
schema = 1
chip = esp32c3
variant = generic-esp32c3
peripherals = gpio, uart, usb, wifi, spi, i2c, pwm, flash
fs_backing = flash
ramdisk_sectors = 600
flash_bytes = 4m
lfs_offset = 512k
xip_flash_base = 0x10000
drivers = drivers/gpio/esp32c3, drivers/serial/esp32c3
features = pwm, spi, i2c

[window]
grain = 4k
stack = 4k
guard = 4k
