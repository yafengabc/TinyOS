# ESP32-C3 chip baseline: Wi-Fi is part of the SoC, and the reference devkit's
# 4 MiB flash is the only board fact.  A module with a different flash part
# changes flash_bytes/lfs_offset here, not in any C file.
[board]
schema = 1
chip = esp32c3
variant = generic-esp32c3
peripherals = gpio, uart, usb, wifi, spi, i2c, pwm, flash
fs_backing = flash
ramdisk_sectors = 1024
flash_bytes = 4m
lfs_offset = 512k
# XIP code placement.  The C3 maps one 64 KiB flash page at 0x42000000, and
# the ROM-loaded boot stub + .data/IRAM image occupies roughly the first
# 6.6 KiB.  Starting the code at 0x4000 leaves about 9.5 KiB of boot-image
# headroom while moving the kernel end 48 KiB below the old 0x10000 layout.
# xip_flash_base is the code's flash offset; xip_map_base is the page the
# boot stub maps (start.S maps 56 pages from it).
xip_flash_base = 0x4000
xip_map_base = 0
drivers = drivers/gpio/esp32c3, drivers/serial/esp32c3
features = pwm, spi, i2c, rir

[window]
grain = 4k
stack = 4k
guard = 4k
# PLAT_STACK_AREA: the initial task-stack area at the top of the user region.
# A chip/ISA fact (PMP/MPU and RAM top), not a board fact; 0 or absent = the
# stack stays inside the data window.
stack_area = 16k
