# ATK-DNRP2350AM with the Hazard3 RISC-V cores: the same physical board, the
# other ISA.  Two bases, because the two halves are orthogonal:
#
#   rp2350rv-generic   the RISC-V port's platform.c, linker script, PICOBIN
#                      header, and (through it) the ARM baseline's layout.c
#   atk-dnr2350am      this board's device table: LED GP3 active low, KEY GP2,
#                      the ST7789 panel, the TF slot, the CH343P UART
#
# Earlier names win, like include paths.  No C file is duplicated for the
# second ISA.
[board]
schema = 1
chip = rp2350
variant = atk-dnr2350am-rv32
base = rp2350rv-generic, atk-dnr2350am
peripherals = gpio, uart, usb, spi, i2c, pwm, dma, pio, lcd, flash
fs_backing = flash
ramdisk_sectors = 1024
flash_bytes = 4m
lfs_offset = 512k
drivers = drivers/gpio/rp2350rv, drivers/spi/rp2350rv, drivers/display/st7789, drivers/usb/rp2350rv, drivers/pio/rp2
# kthreads + usb_pump are the defaults now (see board/rp2350-generic/board.conf);
# the pump thread is the only owner, and `usb_pump_fallback` opts into the
# fallback state used when it cannot be created.
features = pio, rir, kthreads, usb_pump

[user]
# Same policy as board/rp2350rv-generic: try RVC, fall back per program.
rvc = auto
exclude = wifiscan,wificonn,ping,net,dhcp,host,http

[window]
# 16 KiB, not the ARM half's 4 KiB: this image links board/rp2350rv-generic's
# layout.c, where the PMP port puts the stack in its own NAPOT region and the
# on-board tools ask for 16 KiB stacks.  It used to say 4 KiB and the kernel
# panicked at boot (kernel/board_check.c); internal/build/layoutcheck.go now
# refuses to build that mismatch.  The two halves of the chip are two images,
# so the grain is per image.
grain = 16k
stack = 4k
guard = 4k
stack_align = 1
