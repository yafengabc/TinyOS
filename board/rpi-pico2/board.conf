# Raspberry Pi Pico 2 (RP2350A): the same silicon as the ATK board on
# Raspberry Pi's own board, which is the point - board/rpi-pico2 reuses
# the chip baseline's sources through `base =` and replaces only the device table.
#
# Differences from the ATK board, all of them board facts:
#   - LED on GP25, active HIGH (LED to ground through a resistor).
#   - no user key: BOOTSEL is not wired to a GPIO.
#   - no ST7789 panel, so no lcd peripheral and no display driver.
#   - no TF card slot.
#   - 8 MiB QSPI flash (the W25Q64 on this board).
[board]
schema = 1
chip = rp2350
variant = rpi-pico2
base = rp2350-generic
peripherals = gpio, uart, usb, spi, i2c, pwm, dma, pio, flash
fs_backing = flash
ramdisk_sectors = 1024
flash_bytes = 8m
lfs_offset = 512k
# The Pico 2 carries a W25Q64 (8 MiB).  It boots with no second-stage
# loader: measured on hardware, the ROM already leaves the part in EBh quad
# mode with a timing that still reads flash at 150 MHz, so pll_sys_init()
# only moves the clk_sys mux.  The boot failures this board used to show
# were an early console divided for a guessed clock and the SAU being
# disabled too late for the SRAM-resident clock switch, both fixed in
# board/rp2350-generic/platform.c (issue #7).  A boot-time QMI setup was
# tried and removed: on this part it broke XIP instead of helping.
drivers = drivers/gpio/rp2350, drivers/spi/rp2350, drivers/usb/rp2350, drivers/pio/rp2
features = pio, rir

# Programs that need hardware this board does not have.  The display ones are
# the ATK panel's; keeping them in the image would only produce programs that
# open /dev/lcd0 and fail.
[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http,screen,lcdconsole,splash,fb

[window]
grain = 4k
stack = 4k
guard = 4k
