# Raspberry Pi Pico 2 with the Hazard3 RISC-V cores: the same board, the other
# ISA.  Two bases, because the halves are orthogonal:
#
#   rp2350rv-generic   the RISC-V port's platform.c, linker script and PICOBIN
#                      header (and, through it, the ARM baseline's layout.c)
#   rpi-pico2          this board's data: LED GP25 active high, no panel/key
#
# Earlier names win, like include paths.  No C file is duplicated for the
# second ISA.
[board]
schema = 1
chip = rp2350
variant = rpi-pico2-rv32
base = rp2350rv-generic, rpi-pico2
peripherals = gpio, uart, usb, spi, i2c, pwm, dma, pio, flash
fs_backing = flash
ramdisk_sectors = 704
flash_bytes = 8m
lfs_offset = 512k
drivers = drivers/gpio/rp2350rv, drivers/spi/rp2350rv, drivers/usb/rp2350rv, drivers/pio/rp2
features = pio

# The display programs are the ATK panel's; this board has none.
[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http,screen,lcdconsole,splash,fb

[window]
grain = 4k
stack = 4k
guard = 4k
