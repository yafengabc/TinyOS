# ESP32-C3 WiFi station with the small built-in IPv4/DHCP stack.
[build]
target = esp32c3

[features]
wifi = true
net = true
# softfloat = true   # float backend: IEEE binary32 instead of Q16.16

[drivers]
wifi = drivers/wifi/esp32c3

[wifi]
lib_dir = drivers/wifi/esp32c3/lib
ld_script = drivers/wifi/esp32c3/lib/esp32c3.rom.ld
ld_symbol = wifi_probe
