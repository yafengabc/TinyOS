# x86 with the user-space thread library, for `swcost` and `threadtest`.
# The cooperative threads live entirely in user space: the kernel is built
# with TOS_THREADS, which makes process_stack_guard() skip the main
# thread, because a worker's sp in the heap is indistinguishable from a
# real overrun.  That also switches off x86's only stack check for every
# program in this image.  Development/test config only; new code should
# use thread_create() (TOS_KTHREADS) instead.
[build]
target = x86
threads = 1
