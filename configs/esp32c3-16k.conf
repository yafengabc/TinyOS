# ESP32-C3 without WiFi, kernel heap trimmed to 16 KiB.
#
# Measured peak: 768 B after boot, 1536 B after `py pytest.py` plus a 320 KiB
# dd write/read.  Trimming the arena from 80 KiB to 16 KiB gives the task
# area 64 KiB back (240 -> 304 KiB, 15 -> 19 windows of 16 KiB).
# Do not use this with WiFi: the WiFi stack needs the larger arena.
[build]
target = esp32c3
heap = 16384

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http
