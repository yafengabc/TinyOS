# ESP32-C3 without WiFi, 16 KiB kernel heap and 16 process slots.
#
# Measured peak: 768 B after boot, 1536 B after `py pytest.py` plus a 320 KiB
# dd write/read.  Trimming the arena from 80 KiB to 16 KiB gives the task
# area 64 KiB back (240 -> 304 KiB, 15 -> 19 windows of 16 KiB).
# max_procs = 16 raises the live-task ceiling from 8; measured with 12
# background `sleep` jobs plus the shell.  It costs 6.8 KiB of .bss, and the
# kernel end then sits 32 B below a 16 KiB boundary - any kernel growth will
# cost one window.
# Do not use this with WiFi: the WiFi stack needs the larger arena.
[build]
target = esp32c3
heap = 16384
max_procs = 16

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http
