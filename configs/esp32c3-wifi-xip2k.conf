# ESP32-C3 WiFi + net with the XIP code start moved into the boot page.
#
# The default C3 image links its XIP code at 0x42000000 and flashes it at
# 0x10000 because the packer tied the blob offset to the 64 KiB MMU page.
# The page mapping is 0x0..0x10000 -> 0x42000000, and the ROM-loaded boot
# stub only occupies the first ~6 KiB, so the code can start at 0x2000 and
# be fetched at 0x42002000.  That moves the kernel end down by ~56 KiB and
# leaves the same littlefs partition at 0x80000 untouched.
#
# -Oz is part of this variant: the point is maximum room for a future BLE
# blob.  The default esp32c3-wifi.conf stays at its old layout and -O2.
[build]
target = esp32c3-generic
opt = -Oz
xip_code_offset = 8192
xip_map_base = 0

[features]
wifi = true
net = true

[drivers]
wifi = drivers/wifi/esp32c3

[wifi]
lib_dir = drivers/wifi/esp32c3/lib
ld_script = drivers/wifi/esp32c3/lib/esp32c3.rom.ld
ld_symbol = wifi_probe
