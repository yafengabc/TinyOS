# Quiet Pico 2 image on the RISC-V (Hazard3) side, for the shared test corpus.
#   python scripts/rp2040/thumb1-prep.py --arch rv32
#   go run ./cmd/tos build -config configs/rpi-pico2-rv32-quiet.conf
# The expected outputs come from the host interpreter, so this image is
# checked against the same build/thumb1/expected/*.txt as the ARM runs.
[build]
target = rpi-pico2-rv32-smp
boot_trace = 0
