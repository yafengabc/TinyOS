# ESP32-C3 WiFi station with the reduced soft-float runtime.
# Same image as esp32c3-wifi.conf, but softfloat32.c is compiled with
# TOS_SOFTFLOAT_MIN: no subnormals (flush to zero), no NaN/Inf (saturating),
# which saves another ~580 bytes.  Do not use it when the program
# depends on those IEEE corner cases.
[build]
target = esp32c3

[features]
wifi = true
net = true
softfloat-min = true

[drivers]
wifi = drivers/wifi/esp32c3

[wifi]
lib_dir = drivers/wifi/esp32c3/lib
ld_script = drivers/wifi/esp32c3/lib/esp32c3.rom.ld
ld_symbol = wifi_probe
