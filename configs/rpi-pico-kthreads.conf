# RP2040 (Cortex-M0+) with kernel threads.
#
#   go run ./cmd/tos build -config configs/rpi-pico-kthreads.conf
#   flash build/tinyos-rpi-pico.uf2, then over the board's own USB CDC:
#     kthreadtest          (create/join, blocking mutex, concurrent malloc,
#                           stack overflow via the software canary)
#     threadbench
#     ps                   (thr rows: state, stk/sz)
#
# The M0+ has no MPU and no atomics: this is the port where the software
# stack guard and the kernel-assisted mutex are the only mechanisms.
[build]
target = rpi-pico

[features]
kthreads = true

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http,prot
