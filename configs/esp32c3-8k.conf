# ESP32-C3 without WiFi, 8 KiB kernel heap, default process slots.
#
# Measured peak with the 16 KiB arena was 1.5 KiB after `py pytest.py` plus a
# 320 KiB dd write/read; 8 KiB is still several times that.  Dropping the
# arena from 80 KiB to 8 KiB moves the kernel end across the 0x4038C000
# boundary, so the task area grows from 240 KiB to about 320 KiB (20 windows
# of 16 KiB).  Do not use this with WiFi: the WiFi stack needs a larger arena.
[build]
target = esp32c3-generic
heap = 8192

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http
