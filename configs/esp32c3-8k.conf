# ESP32-C3 without WiFi: 8 KiB heap, 8 KiB kernel stack, 16 process slots.
#
# Measured peak with the 16 KiB heap was 1.5 KiB after `py pytest.py` plus a
# 320 KiB dd write/read; both the heap and the kernel stack can be trimmed for
# the no-WiFi build.  With heap=8K, kstack=8K and 16 slots the kernel ends at
# 0x4038B600: 45.5 KiB of RAM, a 320 KiB task area and 20 windows of 16 KiB.
# A 20-cycle soak with py passes.  Do not use these values with WiFi: the
# WiFi stack needs the larger arena and kernel stack.
[build]
target = esp32c3-generic
heap = 8192
kstack = 8192
max_procs = 16

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http
