# ESP32-C3 without WiFi: 8 KiB heap, 8 KiB kernel stack, 18 process slots.
#
# Measured peak with the 16 KiB heap was 1.5 KiB after a 320 KiB dd write/read;
# both the heap and the kernel stack can be trimmed for the no-WiFi build.  With heap=8K, kstack=8K and 18 slots the kernel ends at
# 0x4038BB90: 46.9 KiB of RAM, a 320 KiB task area and 20 windows of 16 KiB.
# 16 background tasks + the shell + one diagnostic command all fit; the 20
# window / 20 slot boundary is 19 slots.  A 20-cycle soak passes.
# Do not use these values with WiFi: the WiFi stack needs the larger arena and
# kernel stack.
[build]
target = esp32c3-generic
heap = 8192
kstack = 8192
max_procs = 18

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http

[features]
scripting = true
rir = false
