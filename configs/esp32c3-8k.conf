# ESP32-C3 without WiFi, 8 KiB kernel heap, 16 process slots.
#
# Measured peak with the 16 KiB arena was 1.5 KiB after `py pytest.py` plus a
# 320 KiB dd write/read; 8 KiB is still several times that.  With 16 slots the
# kernel ends at 0x4038D600: 53.5 KiB of RAM, a 304 KiB task area and 19
# windows of 16 KiB.  Keeping the default 8 slots would give 20 windows but
# only 8 concurrent tasks; 16 slots is the practical balance.
# Do not use this with WiFi: the WiFi stack needs a larger arena.
[build]
target = esp32c3-generic
heap = 8192
max_procs = 16

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http
