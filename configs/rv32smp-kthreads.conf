# QEMU rv32 SMP (virt, two harts) with the experimental kernel-thread API.
#
#   go run ./cmd/tos build -config configs/rv32smp-kthreads.conf
#   go run ./cmd/tostest smoke -target rv32smp -commands "kthreadtest"
#
# The uniprocessor counterpart is configs/rv32-kthreads.conf.  This image is
# where the concurrent sbrk phase actually runs threads on two CPUs.
[build]
target = rv32smp

[features]
kthreads = true
