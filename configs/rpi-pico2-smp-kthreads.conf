# RP2350 Cortex-M33 dual core (Pico 2 ARM) with kernel threads.
#
#   go run ./cmd/tos build -config configs/rpi-pico2-smp-kthreads.conf
#   flash build/tinyos-rpi-pico2-smp.uf2, then over CDC:
#     kthreadtest / threadbench / ps
#
# The M33 has the MPU and atomics; with PLAT_STACK_AREA = 16 KiB thread stacks
# live in the stack area at the top of the user region, so the MPU (not the
# software canary) is what catches a thread overflow.
[build]
target = rpi-pico2-smp

[features]
kthreads = true

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http
