# ESP32-C3 register-IR experiment: csc + rvm + rcc instead of csa + pvm.
#
# Same kernel geometry as esp32c3-8k.conf.  The csc/rvm/rcc trio is excluded
# from ordinary images; enabling [features] rir opts this config in and
# disabling scripting keeps csa + pvm out so the filesystem stays small.
[build]
target = esp32c3-generic
heap = 8192
kstack = 8192
max_procs = 18

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http

[features]
scripting = false
rir = true
