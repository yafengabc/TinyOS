# RP2350 (Hazard3 RISC-V) with the on-board toolchain: csc + rvm + rcc.
#
# The PMP port puts the stack in its own NAPOT region and requires the stack
# request to divide the window grain, so board/rpi-pico2-rv32 sets grain = 16k
# (csc and rcc ask for 16 KiB).  See issue #44.
[build]
target = rpi-pico2-rv32-smp
[features]
rir = true
