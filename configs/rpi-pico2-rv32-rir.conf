# RP2350 (Hazard3 RISC-V) with the on-board toolchain: csc + rvm + rcc.
#
# The PMP port keeps the stack in its own NAPOT region and requires a stack
# hint that divides the 4 KiB window grain (board/rpi-pico2-rv32 has
# stack_align = 1).  The three tools ask for 4 KiB on rv32 for that reason;
# programs that deliberately want a bigger stack cannot run on this image:
#   stk  - burns 16 KiB on purpose to test the stack scan
#   csa  - legacy AMX compiler, 16 KiB
#   py   - Python VM, 16 KiB
# `tos build` now refuses such an image at MKFS time (mklfs --grain), with the
# program name, instead of the kernel refusing it at exec time.
[build]
target = rpi-pico2-rv32-smp
[features]
rir = true
