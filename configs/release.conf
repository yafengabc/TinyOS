# Release image: no boot-progress traces and no TOS_DIAG.
#
# This file deliberately leaves [build] target unset, so it composes with any
# target:
#
#   go run ./cmd/tos build -target rpi-pico2-smp -config configs/release.conf
#
# boot_trace = 0 drops the [A]..[E] bring-up markers, the "[P1] uart ready"
# progress lines, the "[cpu1] secondary ready" / "[mpu] type=..." diagnostics
# and the tick's "[U] cfg=" change notice.  What is left is the banner, the
# heap line and the prompt.
#
# Keep the accept path on the default (traces on): scripts/rp2350/accept33.py
# reads [A]..[E], so an acceptance run must not use this config.
[build]
boot_trace = 0

# USB pump.  The default (development and test images) is the kernel thread as
# the only owner: a failed creation panics, so a board test sees the failure
# instead of a console that still answers.  A release image may add the
# fallback state as a safety net:
#
#   [features]
#   usb_pump_fallback = true
#
# It is deliberately NOT set here yet.  The fallback state has not been run on
# a board (docs/OPEN-ITEMS.md section 22); shipping a path nobody exercised is
# the thing this project tries not to do.  Once one board run of the fallback
# image exists, turn it on here and the release keeps answering even if the
# pump thread cannot be created.

# Release images are for users, not for the acceptance scripts (those run on
# the default, traces-on configs).  Every file costs at least one 4 KiB
# littlefs block, so the examples, demos, probes and the legacy AMX engine are
# dropped: 26 files / 46 blocks (~184 KiB) at the time of this list, while
# msh/sh and the small tools stay.  `py` is already a default exclude; it is
# repeated here so someone reading this list does not add it back.
[user]
exclude = py,hello,hello_printf,csa,pvm,coremark,pio,smp,smpbench,piperace,floattest,rx,rawsink,samp,spin,swcost,rselftest,reloc,cpuprobe,crash,hold,prot,stk,bench,deep,wheap,mem
