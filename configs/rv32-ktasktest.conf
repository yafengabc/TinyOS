# QEMU rv32 (uniprocessor) with the kernel-thread (ktask) selftest.
#
#   go run ./cmd/tos build -config configs/rv32smp-ktasktest.conf
#   go run ./cmd/tostest smoke -target rv32 -commands "cat /proc/ktask"
#
# Starts a priority-0 ktask pinned to CPU 0 before the shell (kernel/process.c,
# TOS_KTASK_TEST).  It sleeps through five ticks, yields once, records which
# CPU it woke on, and stays asleep so /proc/ktask can report its stack
# high-water.  This is the local coverage for the pool/pinning/measurement
# that the WiFi OSI and the USB pump otherwise only exercise on hardware.
[build]
target = rv32

[features]
ktask_test = true
