# ESP32-C3 WiFi station with the optional 32-bit soft-float runtime.
# Same image as esp32c3-wifi.conf plus user/softfloat32.c, so user programs
# can use `float` arithmetic and print_float().  Default configs use Q16.16
# only; this one is for programs that need the extra range/precision.
[build]
target = esp32c3

[features]
wifi = true
net = true
softfloat = true

[drivers]
wifi = drivers/wifi/esp32c3

[wifi]
lib_dir = drivers/wifi/esp32c3/lib
ld_script = drivers/wifi/esp32c3/lib/esp32c3.rom.ld
ld_symbol = wifi_probe
