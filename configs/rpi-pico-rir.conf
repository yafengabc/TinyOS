# RP2040 with the on-board toolchain: csc + rvm + rcc in one image.
#
# The three tools never run at the same time, so the peak window is csc's
# 128 KiB, not the sum.  Sources are staged as .c and compiled on the board,
# which also exercises the M0+ builds of csc and rcc.
[build]
target = rpi-pico
[features]
rir = true
