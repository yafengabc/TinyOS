# RP2040 (Cortex-M0+): on-board register-IR toolchain (csc + rvm + rcc),
# Thumb-1 backend.  Issue #39.
#
# This is the RP2040 counterpart of configs/rv32-rir.conf and
# configs/arm-rir.conf: it turns off the supported scripting pair (csa + pvm)
# so the image carries the experimental csc/rvm/rcc trio instead.
#
# Memory is the whole reason this file needs its own comment: RP2040 has
# 264 KiB of SRAM and no MPU, so the three tools cannot be resident at the
# same time with a comfortable margin.  rcc already compiles in a target
# profile (RIR_MAX 40 KiB, TEXT_MAX 48 KiB, LABEL_MAX 4096, PC_MAX 2048) when
# it sees __arm__/__riscv, so the plan is: csc and rcc run one at a time from
# the shell, each in its own process window, and the 1.5 MiB littlefs holds
# the .rir/.tos files between runs.  Measure the real windows on the board
# (`ps` wink column, `free`) before trusting that: the elfwin.py that #39
# names as evidence does not exist in this tree.
#
# rcc's backend comes from [target] rcc_arch in targets/rpi-pico.conf
# (thumb1), not from __arm__ -- an M0+ image that carried the Thumb-2 code
# generator faulted on the first 32-bit encode.
#
# Do not ship images built with this file: it disables the supported
# scripting pair and enables an experimental toolchain.
[build]
target = rpi-pico

[features]
scripting = false
rir = true
