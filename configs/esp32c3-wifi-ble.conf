# ESP32-C3 WiFi + net with the extra headroom for a future BLE blob.
#
# The board's default XIP code offset is 0x4000 (inside the 64 KiB boot page),
# so every C3 image already gets the 48 KiB saving; the filesystem stays at
# 0x80000.  This config adds -Oz, which is worth another ~26 KiB on the WiFi
# build and leaves about 160 KiB between the kernel end and littlefs.
#
# The default esp32c3-wifi.conf stays at -O2; this one is the size-first
# variant for the BLE bring-up.
[build]
target = esp32c3-generic
opt = -Oz

[features]
wifi = true
net = true

[drivers]
wifi = drivers/wifi/esp32c3

[wifi]
lib_dir = drivers/wifi/esp32c3/lib
ld_script = drivers/wifi/esp32c3/lib/esp32c3.rom.ld
ld_symbol = wifi_probe
