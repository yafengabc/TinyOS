# Test-only config: mounts littlefs read-only (-DTOS_LFS_RO).  Kept in the
# tree because no shipping config sets fs_ro, so this is the only thing that
# builds the read-only half of kernel/ramdisk.c.  Issue #14 was exactly that
# blind spot: hash_path() lived inside the #ifndef TOS_LFS_RO block while
# open_with() called it outside it, and every default config still built.
#
# CI runs this on every push; TESTING.md section 3 lists it as part of T1 for
# changes that touch ramdisk.c or an #ifdef boundary.  Do not ship images
# built with this file: create/unlink fail by design.
[build]
target = rv32
fs_ro = true
