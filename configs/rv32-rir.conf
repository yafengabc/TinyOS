# Test-only config: rv32 QEMU image carrying the register-IR toolchain
# (csc + rvm + rcc) instead of csa + pvm.  QEMU has no ESP32-C3, so this is
# how the native RV32 path gets exercised on a target that runs the kernel's
# real ELF loader: stage rcc .tos files under files.local/bin/ and run them
# from the shell.
#
# Do not ship images built with this file: it turns off the supported
# scripting pair to keep the image focused on the rir experiment.
[build]
target = rv32

[features]
scripting = false
rir = true
