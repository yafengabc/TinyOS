# ESP32-C3 with the legacy csa + pvm pair: the benchmark baseline image.
#
# Same geometry as configs/esp32c3.conf; the pair is opt-in now (the board no
# longer enables scripting by default), so a normal C3 image has no PVM.
[build]
target = esp32c3-generic

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http

[features]
scripting = true
rir = false
