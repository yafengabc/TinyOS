# Quiet rpi-pico2 image: no boot-progress traces and no TOS_DIAG.
#   go run ./cmd/tos build -target rpi-pico2 -config configs/rpi-pico2-quiet.conf
# Only use this after the board has passed with the traces on: the RP2350
# acceptance script (scripts/rp2350/accept33.py) reads the [A]..[E] markers.
[build]
target = rpi-pico2
boot_trace = 0

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http,screen,lcdconsole,splash,fb
