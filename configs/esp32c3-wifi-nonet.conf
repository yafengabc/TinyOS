# ESP32-C3 WiFi without the IPv4/ICMP/DHCP layer: association only.
[build]
target = esp32c3

[features]
wifi = true
net = false

[drivers]
wifi = drivers/wifi/esp32c3

[wifi]
lib_dir = drivers/wifi/esp32c3/lib
ld_script = drivers/wifi/esp32c3/lib/esp32c3.rom.ld
ld_symbol = wifi_probe

# ping/net/dhcp talk to /dev/net, which net=false does not create.
[user]
exclude = ping,net,dhcp
