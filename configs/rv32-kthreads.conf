# QEMU rv32 (virt) with the experimental kernel-thread API.
#
#   go run ./cmd/tos build -config configs/rv32-kthreads.conf
#   go run ./cmd/tostest smoke -target rv32 -commands "kthreadtest"
#
# The ARM counterpart is configs/arm-kthreads.conf.  Both exist so the
# user-space thread library (user/kthread.c) has a repeatable QEMU target
# instead of a hand-written temporary config.
[build]
target = rv32

[features]
kthreads = true
