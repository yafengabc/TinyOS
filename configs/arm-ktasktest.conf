# QEMU mps2 (Cortex-M3) with the kernel-thread (ktask) selftest.
#
#   go run ./cmd/tos build -config configs/arm-ktasktest.conf
#   go run ./cmd/tostest smoke -target arm -commands "cat /proc/ktask"
#
# The ARM port runs a kernel thread in privileged Thread mode on its own PSP
# stack (CONTROL.nPRIV = 0) and switches it with the same frames as a user
# task; the tick accounts time and wakes sleepers but never preempts it, so
# the thread gives up the CPU only at SVC (sleep/yield/exit).  This config is
# the QEMU coverage for that path; the M33/RP2040 boards run the same test by
# hand (docs/OPEN-ITEMS.md section 22).
[build]
target = arm

[features]
ktask_test = true
