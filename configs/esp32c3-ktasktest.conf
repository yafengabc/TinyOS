# ESP32-C3 with the kernel-thread (ktask) selftest.
#
#   go run ./cmd/tos build -config configs/esp32c3-ktasktest.conf
#   python scripts/esp-c3/flash.py -p COM4
#
# The C3 is the uniprocessor ktask environment the WiFi OSI layer uses: it has
# no atomics, and the trap entry reaches the per-hart flag through mscratch.
# Boot must print "[ktest] ktask ran 5 sleeps + yield, cpu_bad=0" and
# "cat /proc/ktask" shows the slot with its stack high-water.  Test image
# only: the shell starts one pid later and the 36 KiB pool is linked in.
[build]
target = esp32c3-generic

[features]
ktask_test = true
