# Legacy AMX scripting pair (csa + pvm) for the benchmark comparison.
#
# The pair is no longer a board default: the default images carry no script
# engine (the C Script trio is opt-in with [features] rir).  Compose this with
# any target to get the PVM baseline back:
#
#   go run ./cmd/tos build -target esp32c3-generic -config configs/pvm.conf
[features]
scripting = true
rir = false
