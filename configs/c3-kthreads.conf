# ESP32-C3 with the experimental kernel-thread API (TOS_KTHREADS).
#
#   go run ./cmd/tos build -config configs/c3-kthreads.conf
#   python scripts/esp-c3/flash.py
#   tos> threadbench
#
# The same config as configs/esp32c3.conf plus the kthreads feature; WiFi
# commands stay out so the image is small and the flash cycle is short.
[build]
target = esp32c3

[features]
kthreads = true

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http
