# RP2040 (Cortex-M0+) dual core with kernel threads.
#
#   go run ./cmd/tos build -config configs/rpi-pico-smp-kthreads.conf
#   flash build/tinyos-rpi-pico-smp.uf2, then kthreadtest / threadbench / ps
#   over the board's own USB CDC.
#
# The second core adds the SIO-gate spinlock path to the kernel mutex and to
# sbrk; both are exercised by kthreadtest's concurrent phases.
[build]
target = rpi-pico-smp

[features]
kthreads = true

[user]
exclude = wifiscan,wificonn,ping,net,dhcp,host,http,prot
