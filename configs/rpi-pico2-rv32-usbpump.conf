# RP2350 Hazard3 (RISC-V) with the USB pump as a kernel thread.
#
#   go run ./cmd/tos build -config configs/rpi-pico2-rv32-usbpump.conf
#
# S4 of docs/THREAD-MODEL.md: usb_cdc_poll() moves out of the tick/idle
# hooks into a pinned kernel thread, so the state machine has a real stack and
# can run while user tasks are runnable.  The ktask trap-entry state is per
# hart (OPEN-ITEMS 21), so the pump may run beside user tasks on the second
# core.  The Cortex-M33 build has its own image now: see
# configs/rpi-pico2-usbpump.conf (E3, privileged Thread mode + PSP stack).
[build]
target = rpi-pico2-rv32-smp

# The pump is not a feature any more: every image with kthreads creates it,
# and a failed creation panics instead of falling back to the tick
# (docs/PROC-THREAD-MODEL.md).
