# RP2350 Hazard3 (RISC-V) with the USB pump as a kernel thread.
#
#   go run ./cmd/tos build -config configs/rpi-pico2-rv32-usbpump.conf
#
# S4 of docs/THREAD-MODEL.md: usb_cdc_poll() moves out of the tick/idle
# hooks into a pinned kernel thread, so the state machine has a real stack and
# can run while user tasks are runnable.  Ktask is RV32-only, which is why
# this exists for the Hazard3 image and not for the Cortex-M33 one.
[build]
target = rpi-pico2-rv32-smp

[features]
usb_pump = true
