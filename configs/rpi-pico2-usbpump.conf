# RP2350 Cortex-M33 (SMP) with the USB pump as a kernel thread.
#
#   go run ./cmd/tos build -config configs/rpi-pico2-usbpump.conf
#
# E3 of docs/PROC-THREAD-MODEL.md (#58): usb_cdc_poll() moves out of the
# idle/PendSV hooks into a pinned kernel thread.  The ARM port runs it in
# privileged Thread mode on its own PSP stack, so the state machine has a
# real stack and keeps running while user tasks are runnable; the tick
# accounts time but never preempts it, and the thread blocks in
# process_ktask_sleep(1) between polls.
#
# The pool costs 36 KiB of .bss (6 slots x 6 KiB) and is only linked in
# images that create a kernel thread; without this feature the board keeps
# the old polled hooks.
[build]
target = rpi-pico2-smp

[features]
usb_pump = true
