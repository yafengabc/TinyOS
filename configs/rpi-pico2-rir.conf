# Pico 2 (Cortex-M33) with the on-board toolchain: csc + rvm + rcc.
#
# Same idea as configs/rpi-pico-rir.conf: the three tools never run at the
# same time, so the peak window is csc's, not the sum.  Sources are staged as
# .c and compiled on the board -- this is what scripts/bench/compare.py needs
# for "csc on the board -> rvm / rcc" numbers.
[build]
target = rpi-pico2-smp
[features]
rir = true
