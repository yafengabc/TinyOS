# ESP32-C3 with the XIP code start inside the boot page, no WiFi.
#
# The default image links its XIP code at 0x42000000 and flashes it at
# 0x10000.  The 64 KiB MMU page covers 0x0..0x10000, and the ROM-loaded boot
# stub only occupies the first few KiB, so the code can start at 0x2000 and
# be fetched at 0x42002000.  The kernel end drops by ~56 KiB while the
# filesystem stays at 0x80000.
[build]
target = esp32c3-generic
opt = -Oz
xip_code_offset = 8192
xip_map_base = 0
