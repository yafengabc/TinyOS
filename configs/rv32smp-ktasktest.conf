# QEMU rv32 SMP with the kernel-thread (ktask) selftest.
#
#   go run ./cmd/tos build -config configs/rv32smp-ktasktest.conf
#   go run ./cmd/tostest smoke -target rv32smp -commands "cat /proc/ktask"
#
# The regression for the per-hart trap state (OPEN-ITEMS 21): the ktask is
# pinned to CPU 0, the shell runs on CPU 1, and before the fix the shell's
# first trap panicked with "kernel stack out of bounds".  Boot must print
# "[ktest] ktask ran 5 sleeps + yield, cpu_bad=0".
[build]
target = rv32smp

[features]
ktask_test = true
